/* =========================================================
   MOTOR
   ========================================================= */
const KEY="cagdas-turk-siiri-testi-v1";
const POETS=["Âkif Paşa","Şinasi","Namık Kemal","Ziya Paşa","Abdülhak Hâmid","Muallim Nâcî","Mehmet Âkif","Yahya Kemal"];
const $=s=>document.querySelector(s);
const stage=$("#stage"), nextBtn=$("#next");
const STEPS=[]; MODULES.forEach((m,mi)=>m.steps.forEach((s,si)=>STEPS.push({...s,mod:mi,id:mi+"."+si})));
const isQ=s=>s.t!=="info";

let S=null;
function fresh(skipInfo){
  const deck=STEPS.map((_,i)=>i).filter(i=>!(skipInfo&&!isQ(STEPS[i])));
  return {deck, pos:0, maxPos:0, lastAns:-1, retry:{}, stats:{}, streak:0, best:0, skipInfo:!!skipInfo, finished:false, wrongIds:[]};
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&Array.isArray(o.deck)&&o.deck.every(i=>STEPS[i])) return o; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
S=load()||fresh(false);
if(S.maxPos==null) S.maxPos=S.pos;
if(S.lastAns==null) S.lastAns=-1;
const reviewing=()=>S.pos<S.maxPos || S.lastAns===S.pos;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function record(idx, ok){
  if(reviewing()) return; // geri dönülen adımlar puanı ve tekrar sırasını etkilemez
  S.lastAns=S.pos;
  const st=STEPS[idx]; const m=st.mod;
  S.stats[m]=S.stats[m]||{seen:0,first:0};
  const firstTime = !S.retry[idx+"_done"];
  if(firstTime){ S.stats[m].seen++; if(ok) S.stats[m].first++; S.retry[idx+"_done"]=1; }
  if(ok){ S.streak++; S.best=Math.max(S.best,S.streak); }
  else{
    S.streak=0;
    if(!S.wrongIds.includes(idx)) S.wrongIds.push(idx);
    const at=Math.min(S.pos+4, S.deck.length);
    S.deck.splice(at,0,idx);
    S.retry[idx]=(S.retry[idx]||0)+1;
  }
  save(); hud();
}

function hud(){
  const st=STEPS[S.deck[Math.min(S.pos,S.deck.length-1)]];
  const m=MODULES[st.mod];
  $("#chapter").innerHTML=`<small>Bölüm ${st.mod+1} / ${MODULES.length}</small><span>${esc(m.title)}</span>`;
  let seen=0,first=0; Object.values(S.stats).forEach(v=>{seen+=v.seen;first+=v.first;});
  $("#acc").textContent= seen? Math.round(first/seen*100)+"%" : "–";
  $("#streak").textContent=S.streak;
  const before=new Set(S.deck.slice(0,S.pos)); const remainingRetries=S.deck.slice(S.pos).filter(i=>before.has(i)).length;
  $("#queue").textContent=remainingRetries;
  const pct= S.finished?100: Math.round(S.pos/S.deck.length*100);
  $("#fill").style.width=pct+"%";
  $("#pos").textContent= S.finished? "Tamamlandı" : `Adım ${S.pos+1} / ${S.deck.length}`;
  $("#modeQ").setAttribute("aria-pressed", S.skipInfo?"true":"false");
}

let onNext=null;
function setNext(label, enabled, fn){ nextBtn.textContent=label; nextBtn.disabled=!enabled; onNext=fn; }
nextBtn.addEventListener("click",()=>{ if(!nextBtn.disabled&&onNext) onNext(); });
function advance(){ S.pos++; S.maxPos=Math.max(S.maxPos,S.pos); if(S.pos>=S.deck.length){ S.finished=true; } save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function skipQ(){
  // cevaplanmadan geçilen soru puanı etkilemez, akisin sonuna eklenir
  if(S.pos>=S.deck.length-1){ advance(); return; }
  const idx=S.deck.splice(S.pos,1)[0]; S.deck.push(idx);
  S.skipped=(S.skipped||0)+1;
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
const backBtn=$("#back");
function goBack(){
  if(S.finished){ S.finished=false; S.pos=S.deck.length-1; }
  else if(S.pos>0){ S.pos--; } else return;
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
backBtn.addEventListener("click",goBack);

function render(){
  hud();
  backBtn.disabled = !S.finished && S.pos===0;
  if(S.finished) return renderEnd();
  const idx=S.deck[S.pos], st=STEPS[idx];
  const isRetry = S.deck.slice(0,S.pos).includes(idx);
  ({info:renderInfo, mc:renderMC, tf:renderTF, match:renderMatch, sort:renderSort, kesit:renderKesit})[st.t](st, idx, isRetry);
  if(nextBtn.disabled) setNext("Atla →", true, reviewing()? advance : skipQ);
}

function head(st,isRetry){
  const kind = st.t==="info" ? st.kind : ({mc:"Soru",tf:"Doğru mu, yanlış mı?",match:"Eşleştirme",sort:"Hangisi?",kesit:"Şiirden kesit"})[st.t];
  const rv = reviewing() ? '<span class="review-tag">Gözden geçirme · puan sayılmaz · </span>' : '';
  return `<div class="kind">${rv}${isRetry&&!rv?'<span class="retry-tag">Tekrar · </span>':''}${esc(kind)}</div>`;
}

function renderInfo(st){
  let h=`<article class="card">${head(st)}<h1>${esc(st.title)}</h1>`;
  if(st.poet) h+=`<p class="src">${esc(st.poet)}</p>`;
  if(st.verse) h+=`<div class="verse">${esc(st.verse)}</div>`;
  if(st.table){ h+=`<div class="tbl"><table><thead><tr>${st.table.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${st.table.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th scope="row">${esc(c)}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
  (st.secs||[]).forEach(s=>{ h+=`<section class="sec">${s.h?`<h2>${esc(s.h)}</h2>`:""}${s.p?`<p>${esc(s.p)}</p>`:""}${s.list?`<ul>${s.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</section>`; });
  h+=`</article>`;
  stage.innerHTML=h;
  setNext("Okudum, soruya geç", true, advance);
}

function feedback(ok, why){
  const d=document.createElement("div"); d.className="fb "+(ok?"ok":"no");
  d.innerHTML=`<strong>${ok?"Doğru.":(reviewing()?"Yanlış.":"Yanlış. Bu soru birkaç adım sonra tekrar gelecek.")}</strong>${why?`<span>${esc(why)}</span>`:""}`;
  return d;
}

function renderChoice(st, idx, isRetry, opts, correctIdx){
  const order = opts.length>2 ? shuffle(opts.map((_,i)=>i)) : opts.map((_,i)=>i);
  stage.innerHTML=`<article class="card">${head(st,isRetry)}<p class="q">${esc(st.q)}</p><div class="opts">${order.map((oi,k)=>`<button class="opt" type="button" data-i="${oi}"><span class="k">${k+1}</span><span>${esc(opts[oi])}</span></button>`).join("")}</div></article>`;
  const card=stage.querySelector(".card");
  setNext("Devam", false, null);
  stage.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const pick=+b.dataset.i, ok=pick===correctIdx;
    stage.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.i===correctIdx) x.classList.add("ok"); });
    if(!ok) b.classList.add("no");
    card.appendChild(feedback(ok, st.why));
    record(idx, ok);
    setNext("Devam", true, advance); nextBtn.focus();
  }));
}
function renderMC(st,idx,r){ renderChoice(st,idx,r,st.o,st.a); }
function renderTF(st,idx,r){ renderChoice(st,idx,r,["Doğru","Yanlış"], st.a?0:1); }

function renderKesit(st, idx, isRetry){
  const poetOpts=shuffle([st.p, ...shuffle(POETS.filter(x=>x!==st.p)).slice(0,3)]);
  let themeOpts=null;
  if(st.only!=="p"){
    const pool=[...new Set(STEPS.filter(s=>s.t==="kesit"&&s.th&&s.p!==st.p).map(s=>s.th))].filter(x=>x!==st.th);
    themeOpts=shuffle([st.th, ...shuffle(pool).slice(0,3)]);
  }
  const stages = themeOpts ? 2 : 1;
  stage.innerHTML=`<article class="card">${head(st,isRetry)}<div class="verse">${esc(st.v)}</div><div id="kq"></div></article>`;
  const card=stage.querySelector(".card"), kq=card.querySelector("#kq");
  let allOk=true;
  setNext("Devam", false, null);
  function ask(label, opts, correct, isLast){
    const box=document.createElement("div"); box.className="sec"; box.style.gap="10px";
    box.innerHTML=`<p class="q">${esc(label)}</p><div class="opts">${opts.map((o,k)=>`<button class="opt" type="button" data-v="${esc(o)}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    kq.appendChild(box);
    box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const ok=b.dataset.v===correct; if(!ok) allOk=false;
      box.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.v===correct) x.classList.add("ok"); });
      if(!ok) b.classList.add("no");
      if(!isLast){
        const note=document.createElement("p"); note.className="src"; note.textContent= ok?"Doğru şair. Şimdi temayı seç.":`Şair: ${correct}. Şimdi temayı seç.`; box.appendChild(note);
        ask("Bu kesitin teması nedir?", themeOpts, st.th, true);
      } else {
        card.appendChild(feedback(allOk, (stages===2&&!allOk?`Şair: ${st.p}. Tema: ${st.th}. `:"")+(st.why||"")));
        record(idx, allOk); setNext("Devam", true, advance); nextBtn.focus();
      }
    }));
  }
  ask("Bu kesit hangi şaire ait?", poetOpts, st.p, stages===1);
}

function renderMatch(st, idx, isRetry){
  const L=shuffle(st.pairs.map((p,i)=>i)), R=shuffle(st.pairs.map((p,i)=>i));
  stage.innerHTML=`<article class="card">${head(st,isRetry)}<p class="q">${esc(st.q)}</p><p class="src">Soldan birini, sonra sağdan karşılığını seç.</p>
   <div class="match"><div class="col">${L.map(i=>`<button class="mi" type="button" data-side="L" data-i="${i}">${esc(st.pairs[i][0])}</button>`).join("")}</div>
   <div class="col">${R.map(i=>`<button class="mi" type="button" data-side="R" data-i="${i}">${esc(st.pairs[i][1])}</button>`).join("")}</div></div></article>`;
  const card=stage.querySelector(".card");
  let selL=null, selR=null, errors=0, done=0;
  setNext("Devam", false, null);
  const same=(a,b)=>st.pairs[a][1]===st.pairs[b][1]; // aynı sağ değerli eşler (ör. iki Nâcî eseri) birbirinin yerine geçebilir
  function tryPair(){
    if(selL==null||selR==null) return;
    const lb=stage.querySelector(`.mi[data-side="L"][data-i="${selL}"]`), rb=stage.querySelector(`.mi[data-side="R"][data-i="${selR}"]`);
    if(selL===selR || same(selL,selR)){
      lb.className="mi done"; rb.className="mi done"; lb.disabled=rb.disabled=true; done++;
    } else {
      errors++; [lb,rb].forEach(b=>{b.classList.remove("sel");b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),350);});
    }
    selL=selR=null;
    if(done===st.pairs.length){
      const ok=errors===0;
      card.appendChild(feedback(ok, ok? (st.why||"Hepsini ilk denemede eşleştirdin.") : `${errors} hatalı deneme. ${st.why||""}`));
      record(idx, ok); setNext("Devam", true, advance); nextBtn.focus();
    }
  }
  stage.querySelectorAll(".mi").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("done")) return;
    const side=b.dataset.side, i=+b.dataset.i;
    stage.querySelectorAll(`.mi[data-side="${side}"]`).forEach(x=>{ if(!x.classList.contains("done")) x.classList.remove("sel"); });
    b.classList.add("sel");
    if(side==="L") selL=i; else selR=i;
    tryPair();
  }));
}

function renderSort(st, idx, isRetry){
  const items=shuffle(st.items); let k=0, errors=0; const res=[];
  stage.innerHTML=`<article class="card">${head(st,isRetry)}<p class="q">${esc(st.q)}</p>
   <div class="dots">${items.map(()=>`<span class="dot"></span>`).join("")}</div>
   <div class="stmt" id="stmt"></div>
   <div class="sides"><button class="side" type="button" data-s="L"><span class="k">1</span> ${esc(st.L)}</button><button class="side" type="button" data-s="R"><span class="k">2</span> ${esc(st.R)}</button></div>
   <div id="sfb"></div></article>`;
  const card=stage.querySelector(".card"), dots=stage.querySelectorAll(".dot");
  setNext("Devam", false, null);
  function show(){ dots.forEach((d,i)=>d.classList.toggle("cur",i===k)); $("#stmt").textContent=items[k][0]; }
  show();
  stage.querySelectorAll(".side").forEach(b=>b.addEventListener("click",()=>{
    if(k>=items.length) return;
    const ok=b.dataset.s===items[k][1];
    dots[k].classList.add(ok?"ok":"no"); if(!ok){ errors++; res.push(items[k]); }
    const f=$("#sfb"); f.innerHTML="";
    if(!ok){ const d=document.createElement("div"); d.className="fb no"; d.innerHTML=`<strong>Yanlış.</strong><span>"${esc(items[k][0])}" → ${esc(items[k][1]==="L"?st.L:st.R)}</span>`; f.appendChild(d); }
    k++;
    if(k<items.length){ show(); }
    else {
      dots.forEach(d=>d.classList.remove("cur")); $("#stmt").textContent="Bitti.";
      stage.querySelectorAll(".side").forEach(x=>x.disabled=true);
      const ok2=errors===0;
      f.innerHTML=""; f.appendChild(feedback(ok2, ok2?`${items.length} ifadenin hepsi doğru.`:`${items.length} ifadeden ${errors} tanesini karıştırdın.`));
      record(idx, ok2); setNext("Devam", true, advance); nextBtn.focus();
    }
  }));
}

function renderEnd(){
  let seen=0,first=0; Object.values(S.stats).forEach(v=>{seen+=v.seen;first+=v.first;});
  const rows=MODULES.map((m,i)=>{ const v=S.stats[i]; if(!v||!v.seen) return ""; const p=Math.round(v.first/v.seen*100);
    return `<div class="rrow"><span>${esc(m.title)}</span><b style="font-variant-numeric:tabular-nums">${v.first}/${v.seen}</b><div class="rbar"><i style="width:${p}%"></i></div></div>`; }).join("");
  const weak=MODULES.map((m,i)=>({m,i,v:S.stats[i]})).filter(x=>x.v&&x.v.seen&&x.v.first/x.v.seen<.75).map(x=>x.m.title);
  stage.innerHTML=`<article class="card"><div class="kind">Sonuç</div><h1>Akış tamamlandı</h1>
    <div class="row" style="align-items:end;gap:28px"><div><div class="big">${seen?Math.round(first/seen*100):0}%</div><p class="src">ilk denemede doğru</p></div><div><div class="big">${S.best}</div><p class="src">en uzun seri</p></div><div><div class="big">${S.wrongIds.length}</div><p class="src">en az bir kez yanlış yapılan soru</p></div></div>
    <section class="sec"><h2>Bölümlere göre</h2><div class="res">${rows}</div></section>
    ${weak.length?`<section class="sec"><h2>Tekrar etmen gerekenler</h2><p>${esc(weak.join(" · "))}</p></section>`:""}
    <div class="row"><button class="btn" type="button" id="redoWrong" ${S.wrongIds.length?"":"disabled"}>Yanlış yaptıklarımı yeniden çöz</button><button class="btn ghost" type="button" id="redoAll">Baştan başla</button></div></article>`;
  setNext("Bitti", false, null);
  $("#redoAll").onclick=()=>{ S=fresh(S.skipInfo); save(); render(); };
  const rw=$("#redoWrong"); if(rw) rw.onclick=()=>{ const w=S.wrongIds.slice(); const sk=S.skipInfo; S=fresh(sk); S.deck=shuffle(w); save(); render(); };
}

$("#restart").addEventListener("click",()=>{ S=fresh(S.skipInfo); save(); render(); window.scrollTo({top:0}); });
$("#modeQ").addEventListener("click",()=>{
  const sk=!S.skipInfo;
  if(S.finished||S.pos===0){ S=fresh(sk); }
  else {
    const cur=S.deck[S.pos];
    const rest=S.deck.slice(S.pos).filter(i=>!(sk&&!isQ(STEPS[i])));
    let tail=rest;
    if(!sk){ // bilgi kartlarını geri ekle: kalan sorulardan önce gelen bilgi kartlarını sıraya koy
      const lastDone=S.deck.slice(0,S.pos); const maxDone=lastDone.length?Math.max(...lastDone):-1;
      tail=STEPS.map((_,i)=>i).filter(i=>i>maxDone && (!isQ(STEPS[i]) || rest.includes(i)));
      rest.forEach(i=>{ if(i<=maxDone) tail.push(i); });
    }
    S.deck=S.deck.slice(0,S.pos).concat(tail.length?tail:[cur]);
    S.skipInfo=sk;
  }
  save(); render();
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="ArrowLeft"&&!backBtn.disabled){ e.preventDefault(); goBack(); return; }
  if(e.key==="Enter"&&!nextBtn.disabled&&onNext!==skipQ&&document.activeElement?.tagName!=="BUTTON"){ e.preventDefault(); nextBtn.click(); return; }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4){
    const opts=stage.querySelectorAll(".opt:not([disabled])"); if(opts[n-1]){ opts[n-1].click(); return; }
    const sides=stage.querySelectorAll(".side:not([disabled])"); if(sides[n-1]) sides[n-1].click();
  }
});
render();
</script>

</body>
</html>
